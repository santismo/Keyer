<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Keyer Standards">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="stylesheet" href="standards.css">
  <title>Keyer · Jazz Standards</title>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><h1>Keyer</h1><span>Jazz Standards</span></div>
      <nav aria-label="Keyer views">
        <a href="index.html">Cards</a>
        <a href="practice.html">Practice</a>
        <a href="wheel.html">Circle</a>
      </nav>
    </header>

    <section class="library-card" aria-labelledby="library-title">
      <h2 class="sr-only" id="library-title">Jazz standard library</h2>
      <div class="library-row">
        <div class="search-wrap">
          <label class="sr-only" for="songSearch">Find a jazz standard</label>
          <input id="songSearch" type="search" inputmode="search" autocomplete="off" placeholder="Find a standard or composer…" aria-autocomplete="list" aria-controls="searchResults" aria-expanded="false">
          <div class="search-results" id="searchResults" role="listbox" hidden></div>
        </div>
        <button class="square-button" id="randomSong" type="button" aria-label="Choose a random standard" title="Random standard">↻</button>
      </div>
      <p class="library-status" id="libraryStatus" role="status">Loading jazz standards…</p>
    </section>

    <section class="lesson" id="lesson" hidden>
      <header class="song-heading">
        <div>
          <h2 id="songTitle">Jazz standard</h2>
          <p id="songComposer"></p>
        </div>
        <div class="song-meta" id="songMeta"></div>
      </header>

      <div class="workspace">
        <section class="chart-panel" aria-labelledby="chart-title">
          <div class="panel-head">
            <h3 id="chart-title">Chart</h3>
            <span id="chartStatus">Tap any chord</span>
          </div>
          <div class="chart-scroll" id="chartScroll">
            <div class="realbook-chart" id="chart" aria-label="Clickable Real Book-style chord chart"></div>
          </div>
        </section>

        <aside class="study-card" aria-labelledby="selectedChord">
          <div class="study-topline">
            <span id="sectionReadout">A · C major</span>
            <button class="note-label-toggle" id="toggleNoteNames" type="button" aria-label="Hide note names on piano keys" aria-pressed="true">Names: On</button>
            <span id="chordProgress">1 / 1</span>
          </div>
          <div class="chord-navigator">
            <button id="previousChord" type="button" aria-label="Previous chord">‹</button>
            <div class="chord-identity" aria-live="polite" aria-atomic="true">
              <strong id="selectedChord">Cmaj7</strong>
              <span id="scaleName">C Ionian / major</span>
            </div>
            <button id="nextChord" type="button" aria-label="Next chord">›</button>
          </div>

          <div class="piano" id="piano" role="group" aria-label="Piano showing scale and suggested voicing"></div>

          <div class="color-legend" aria-label="Piano colors">
            <span><i class="bass-swatch"></i>Bass</span>
            <span><i class="voicing-swatch"></i>Voicing</span>
            <span><i class="chord-swatch"></i>Other chord tone</span>
            <span><i class="scale-swatch"></i>Scale</span>
          </div>

          <div class="study-details">
            <div><b>Voicing</b><span id="voicingNotes"></span></div>
            <div><b>Scale</b><span id="scaleNotes"></span></div>
          </div>

          <button class="play-voicing" id="playVoicing" type="button">
            <span aria-hidden="true">▶</span> Play voicing
          </button>
        </aside>
      </div>
    </section>

    <section class="error-card" id="errorCard" hidden>
      <h2>Could not open the standards catalog</h2>
      <p id="errorMessage">Check your connection and try again.</p>
      <button id="retryLoad" type="button">Try again</button>
    </section>
  </main>

  <script src="jazz-theory.js"></script>
  <script src="ireal.js"></script>
  <script src="standards.js"></script>
</body>
</html>
